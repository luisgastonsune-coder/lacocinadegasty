// ─── STORAGE ──────────────────────────────────────────────────────────────────
// Suscripción en tiempo real a un documento de Firebase
function subscribeData(key, callback) {
  let unsub = null;
  let cancelled = false;
  const trySubscribe = () => {
    if (cancelled) return;
    const d = window._db;
    if (!d) { setTimeout(trySubscribe, 400); return; }
    const ref = d.doc(d.fs, "gasty", key);
    unsub = d.onSnapshot(ref, (snap) => {
      const val = snap.exists() ? (snap.data().value ?? snap.data().v) : null;
      callback(val);
    }, (err) => { console.warn("subscribeData error:", key, err); });
  };
  trySubscribe();
  // Retorna función para cancelar la suscripción
  return () => { cancelled = true; if (unsub) unsub(); };
}

async function loadData(key, fallback) {
  try {
    const db = await getDB();
    const ref = db.doc(db.fs, "gasty", key);
    const snap = await db.getDoc(ref);
    return snap.exists() ? snap.data().value : fallback;
  } catch {
    try { const r = await window.storage.get(key); return r ? JSON.parse(r.value) : fallback; }
    catch { return fallback; }
  }
}
async function saveData(key, val) {
  try {
    const db = await getDB();
    const ref = db.doc(db.fs, "gasty", key);
    await db.setDoc(ref, { value: val });
  } catch {
    try { await window.storage.set(key, JSON.stringify(val)); } catch {}
  }
}

function buildInitialStock() {
  const s = { pizzas: {} };
  PIZZAS.forEach((p) => { s.pizzas[p.id] = 10; });
  DIAS.forEach((dia) => {
    s[dia] = {};
    MENU[dia].forEach((item) => { s[dia][item.id] = item.stock; });
  });
  return s;
}

            <button onClick={() => setShowCarrito(true)} style={{ background: C.gold, color: "#fff", border: "none", borderRadius: 50, padding: "12px 18px", fontFamily: "Georgia,serif", fontWeight: "bold", fontSize: 14, cursor: "pointer", boxShadow: "0 4px 16px rgba(0,0,0,0.25)", display: "flex", alignItems: "center", gap: 8 }}>

        {/* Navegación inferior */}
        <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, background: "#fff", borderTop: "1px solid rgba(123,58,16,0.15)", display: "flex", zIndex: 100, maxWidth: 500, margin: "0 auto" }}>
          <button style={{...S.navBtn(navTab === "caseras"), flex: 1.2}} onClick={() => setNavTab("caseras")}>
            <span style={{ fontSize: 22 }}>🥘</span>
            <span>Comidas Caseras</span>
          </button>
          <button style={{...S.navBtn(navTab === "pizzas"), flex: 1}} onClick={() => setNavTab("pizzas")}>
            <span style={{ fontSize: 22 }}>🍕</span>
            <span>Pizzas</span>
          </button>
        </div>

        <div style={S.body}>

          {/* ── COMIDAS CASERAS ── */}
          {navTab === "caseras" && (
            <>
              <div style={{ background: `linear-gradient(135deg, ${C.brown}, #a0521e)`, color: C.cream, borderRadius: 14, padding: "16px", marginBottom: 16, textAlign: "center", boxShadow: "0 4px 15px rgba(123,58,16,0.3)" }}>
                <div style={{ fontSize: 20, fontWeight: "bold", marginBottom: 4 }}>🥘 Comidas Caseras</div>
                <div style={{ fontSize: 12, color: "#d4b896" }}>Hechas con amor · Con 24-48hs de anticipación</div>
              </div>
              {/* Todos los items de todas las categorías sin días */}
              {DIAS.flatMap((dia) => [...MENU[dia].filter(m => !menuEdits?.[m.id]?.oculto).map(m => applyMenuEdit(m, menuEdits)), ...(extraItemsByDia[dia] || []).filter(i => i.activo !== false)]).filter((item, idx, arr) => arr.findIndex(x => x.id === item.id) === idx).map((item) => {
                const dia = DIAS.find(d => [...MENU[d], ...(extraItemsByDia[d] || [])].some(x => x.id === item.id)) || DIAS[0];
                return <ItemCard key={item.id} item={item} dia={dia} carrito={carrito} stock={Math.max(...DIAS.map(d => stock[d]?.[item.id] ?? 0))} onAdd={addToCart} onRemove={removeFromCart} />;
              })}
            </>
          )}

          {/* ── PIZZAS (sección fija) ── */}
          {navTab === "pizzas" && (
            <>
              <div style={{ background: `linear-gradient(135deg, #8B2500, ${C.brown})`, color: C.cream, borderRadius: 14, padding: "16px", marginBottom: 16, textAlign: "center", boxShadow: "0 4px 15px rgba(139,37,0,0.4)" }}>
                <div style={{ fontSize: 20, fontWeight: "bold", marginBottom: 4 }}>🍕 Pizzas Pre-Cocidas</div>
                <div style={{ fontSize: 12, color: "#d4b896" }}>Listas para hornear en 5 min · Disponibles todos los días</div>
              </div>
              {[...PIZZAS.filter(p => !menuEdits?.[p.id]?.oculto).map(p => applyMenuEdit(p, menuEdits)), ...extraItems.filter(i => i.activo !== false)].map((item) => (
                <div key={item.id} style={{ background: "#fff", borderRadius: 16, marginBottom: 14, overflow: "hidden", boxShadow: "0 3px 14px rgba(123,58,16,0.12)", border: "1px solid rgba(123,58,16,0.08)" }}>
                  {item.foto && (
                    <div style={{ position: "relative" }}>
                      <div style={{ overflow: "hidden", height: 170, display: "flex", alignItems: "center", justifyContent: "center", background: "#faf6f0" }}>
                      <img src={item.foto} alt={item.nombre} style={{ width: "100%", height: "100%", objectFit: "contain", transform: `scale(${(fotoEscalas[item.id] || fotoEscalas[item.nombre?.toLowerCase().replace(/\s+/g,'_')] || 100)/100})`, transformOrigin: "center center", transition: "transform 0.2s" }} />
                    </div>
                      <div style={{ position: "absolute", bottom: 0, left: 0, right: 0, background: "linear-gradient(transparent, rgba(0,0,0,0.6))", padding: "20px 14px 10px" }}>
                        <div style={{ color: "#fff", fontWeight: "bold", fontSize: 16 }}>{item.emoji} {item.nombre}</div>
                        <div style={{ color: "#f0d0a0", fontSize: 12 }}>{item.descripcion}</div>
                      </div>
                    </div>
                  )}
                  <div style={{ padding: "12px 14px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                    {!item.foto && <div><div style={{ fontWeight: "bold", fontSize: 15 }}>{item.emoji} {item.nombre}</div><div style={{ fontSize: 12, color: "#888" }}>{item.descripcion}</div></div>}
                    {item.foto && <div/>}
                    <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                      <span style={{ fontWeight: "bold", color: C.gold, fontSize: 16 }}>{formatPrice(item.precio)}</span>
                      {(stock.pizzas?.[item.id] ?? 0) > 0 ? (
                        carrito[`pizzas__${item.id}`] ? (
                          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                            <button onClick={() => removeFromCart(`pizzas__${item.id}`)} style={{ width: 32, height: 32, borderRadius: "50%", border: `2px solid ${C.brown}`, background: "transparent", color: C.brown, fontSize: 20, cursor: "pointer", lineHeight: 1 }}>−</button>
                            <span style={{ fontWeight: "bold", fontSize: 17, minWidth: 24, textAlign: "center" }}>{carrito[`pizzas__${item.id}`]?.cantidad}</span>
                            <button onClick={() => addToCart(`pizzas__${item.id}`, "pizzas", item)} style={{ width: 32, height: 32, borderRadius: "50%", background: C.brown, border: "none", color: C.cream, fontSize: 20, cursor: "pointer", lineHeight: 1 }}>+</button>
                          </div>
                        ) : (
                          <button onClick={() => addToCart(`pizzas__${item.id}`, "pizzas", item)} style={{ ...S.btn(C.gold), fontSize: 13, padding: "8px 18px", borderRadius: 20 }}>+ Agregar</button>
                        )
                      ) : (
                        <span style={{ fontSize: 12, color: "#ccc", background: "#f5f5f5", padding: "6px 12px", borderRadius: 16 }}>Sin stock</span>
                      )}
                    </div>
                  </div>
                </div>
              ))}
            </>
          )}


          <div style={{ textAlign: "center", marginTop: 20 }}>
            <button style={{ background: "transparent", border: "none", color: "#bbb", fontSize: 12, cursor: "pointer" }} onClick={() => { setScreen("login"); setNombre(""); setPass(""); setCarrito({}); }}>Cerrar sesión</button>
          </div>
        </div>
      </div>
    );
  }

  // ── ADMIN ──
  if (screen === "admin") {
    return (
      <div style={S.app}>
        <div style={S.header}>
          <div style={{ fontSize: 12, letterSpacing: 2, color: C.gold }}>Panel Admin</div>
          <div style={{ fontSize: 22, fontWeight: "bold" }}>La Cocina de Gasty</div>
        </div>
        <div style={S.body}>
          {/* Tabs */}
          <div style={{ display: "flex", gap: 6, marginBottom: 16, overflowX: "auto" }}>
            {["pedidos","stock","menu","fotos"].map(t => (
              <button key={t} style={{ ...S.tab(adminTab === t), flex: "none", padding: "8px 16px", borderRadius: 20, fontSize: 12, textTransform: "capitalize" }}
                onClick={() => setAdminTab(t)}>
                {t === "pedidos" ? `📋 Pedidos (${pedidos.length})` : t === "stock" ? "📦 Stock" : t === "menu" ? "✏️ Menú" : "🖼 Fotos"}
              </button>
            ))}
          </div>

          {/* ── PEDIDOS ── */}
          {adminTab === "pedidos" && (
            <>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
                <span style={{ fontSize: 13, color: "#888" }}>{pedidos.filter(p=>!p.entregado).length} pendientes · {pedidos.filter(p=>p.entregado).length} entregados</span>
                {pedidos.length > 0 && <button onClick={async () => { await saveData("gasty-pedidos", []); setPedidos([]); }} style={{ background: "#c0392b", color: "#fff", border: "none", borderRadius: 8, padding: "6px 14px", cursor: "pointer", fontSize: 13 }}>🗑 Limpiar todo</button>}
              </div>
              {pedidos.length === 0 && <p style={{ color: "#aaa" }}>Todavía no hay pedidos.</p>}
              {[...pedidos].reverse().map((p) => (
                <div key={p.id} style={{ ...S.card, opacity: p.entregado ? 0.5 : 1, borderLeft: p.entregado ? "4px solid #27ae60" : "4px solid "+C.brown }}>
                  <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
                    <strong style={{ textDecoration: p.entregado ? "line-through" : "none" }}>👤 {p.cliente}</strong>
                    <span style={{ fontSize: 12, color: "#aaa" }}>{p.fecha} {p.hora}</span>
                  </div>
                  {p.celular && <div style={{ fontSize: 13, color: "#555", marginBottom: 6 }}>📱 {p.celular}</div>}
                  {p.items.map((it, i) => (
                    <div key={i} style={{ fontSize: 13, color: "#555", marginBottom: 2 }}>• {it.nombre} ×{it.cantidad} ({it.dia}) — {formatPrice(it.precio * it.cantidad)}</div>
                  ))}
                  {p.nota && <p style={{ fontSize: 12, color: "#888", fontStyle: "italic", margin: "6px 0 0" }}>📝 {p.nota}</p>}
                  <div style={{ marginTop: 8, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                    <span style={{ fontWeight: "bold", color: C.gold }}>Total: {formatPrice(p.total)}</span>
                    <button onClick={async () => {
                      const updated = pedidos.map(x => x.id === p.id ? {...x, entregado: !x.entregado} : x);
                      setPedidos(updated);
                      await saveData("gasty-pedidos", updated);
                    }} style={{ background: p.entregado ? "#888" : "#27ae60", color: "#fff", border: "none", borderRadius: 8, padding: "5px 12px", cursor: "pointer", fontSize: 12 }}>
                      {p.entregado ? "↩ Desmarcar" : "✓ Entregado"}
                    </button>
                  </div>
                </div>
              ))}
            </>
          )}

          {/* ── STOCK ── */}
          {adminTab === "stock" && (
            <StockAdmin
              stock={stock} setStock={setStock}
              editStock={editStock} setEditStock={setEditStock}
              extraItems={extraItems} setExtraItems={setExtraItems}
              extraItemsByDia={extraItemsByDia} setExtraItemsByDia={setExtraItemsByDia}
              menuEdits={menuEdits} setMenuEdits={setMenuEdits}
              handleStockSave={handleStockSave}
            />
          )}

          {/* ── MENÚ ── */}
          {adminTab === "menu" && <MenuAdmin extraItems={extraItems} setExtraItems={setExtraItems} extraItemsByDia={extraItemsByDia} setExtraItemsByDia={setExtraItemsByDia} stock={stock} setStock={setStock} />}

          {/* ── FOTOS ── */}
          {adminTab === "fotos" && <FotosAdmin fotosCustom={fotosCustom} setFotosCustom={setFotosCustom} />}

          <div style={{ textAlign: "center", paddingBottom: 20 }}>
            <button style={{ background: "transparent", border: "none", color: "#bbb", fontSize: 12, cursor: "pointer" }} onClick={() => { setScreen("login"); setPass(""); }}>Cerrar sesión</button>
          </div>
        </div>
      </div>
    );
  }

  return null;
}

// ── STOCK ADMIN COMPONENT ────────────────────────────────────────────────────
function StockAdmin({ stock, setStock, editStock, setEditStock, extraItems, setExtraItems, extraItemsByDia, setExtraItemsByDia, menuEdits, setMenuEdits, handleStockSave }) {
  const { useState: useS, useEffect: useEff, useRef: useR } = React;
  const [localEdits, setLocalEdits] = useS({});
  const localEditsRef = useR({});
  const [msg, setMsg] = useS("");

  // Inicializar localEdits con TODOS los items del menú + valores de Firebase
  useEff(() => {
    if (menuEdits != null) {
      // Construir objeto con TODOS los items del menú base
      const all = {};
      // Pizzas
      [...PIZZAS, ...extraItems].forEach(item => {
        const ed = menuEdits[item.id] || {};
        all[item.id] = {
          nombre: ed.nombre ?? item.nombre,
          descripcion: ed.descripcion ?? item.descripcion,
          precio: ed.precio ?? item.precio,
          oculto: ed.oculto ?? false,
        };
      });
      // Comidas caseras
      const DIAS_LOCAL = ["Lunes", "Martes", "Miércoles", "Jueves"];
      DIAS_LOCAL.forEach(dia => {
        [...MENU[dia], ...(extraItemsByDia[dia] || [])].forEach(item => {
          const ed = menuEdits[item.id] || {};
          all[item.id] = {
            nombre: ed.nombre ?? item.nombre,
            descripcion: ed.descripcion ?? item.descripcion,
            precio: ed.precio ?? item.precio,
            oculto: ed.oculto ?? false,
          };
        });
      });
      setLocalEdits(all);
      localEditsRef.current = all;
    }
  }, [menuEdits, extraItems, extraItemsByDia]);

  const showMsg = (m) => { setMsg(m); setTimeout(() => setMsg(""), 2500); };

  const setField = (id, field, val) => {
    setLocalEdits(prev => {
      const next = { ...prev, [id]: { ...(prev[id] || {}), [field]: val } };
      localEditsRef.current = next;
      return next;
    });
  };

  const getVal = (item, field) => {
    if (field === "nombre") return localEdits[item.id]?.nombre ?? item.nombre;
    if (field === "descripcion") return localEdits[item.id]?.descripcion ?? item.descripcion;
    if (field === "precio") return localEdits[item.id]?.precio ?? item.precio;
    return "";
  };

  const isOculto = (id) => !!localEdits[id]?.oculto;

  const toggleOculto = (id) => {
    setLocalEdits(prev => ({ ...prev, [id]: { ...(prev[id] || {}), oculto: !prev[id]?.oculto } }));
  };

  const handleSave = async () => {
    // Usar ref para tener el valor más actualizado (evita problema de cierre asíncrono)
    const currentEdits = localEditsRef.current;
    const cleaned = {};
    Object.entries(currentEdits).forEach(([id, ed]) => {
      cleaned[id] = { ...ed, precio: ed.precio ? parseInt(ed.precio) : undefined };
    });
    await handleStockSave(cleaned);
    showMsg("✅ Guardado");
  };

  const renderRow = (item, categoria, dia) => {
    const stockVal = categoria === "pizzas"
      ? (editStock["pizzas"]?.[item.id] ?? stock?.pizzas?.[item.id] ?? 0)
      : (editStock[dia]?.[item.id] ?? stock?.[dia]?.[item.id] ?? 0);
    const oculto = isOculto(item.id);
    const isExtra = item.id?.startsWith("custom-");

    return (
      <div key={item.id} style={{ borderBottom: "1px solid #f0e8de", paddingBottom: 12, marginBottom: 12, opacity: oculto ? 0.45 : 1 }}>
        {/* Fila 1: nombre + stock + borrar/ocultar */}
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
          <span style={{ fontSize: 15 }}>{item.emoji}</span>
          <input
            value={getVal(item, "nombre")}
            onChange={e => setField(item.id, "nombre", e.target.value)}
            style={{ flex: 1, padding: "5px 8px", borderRadius: 6, border: "1.5px solid rgba(123,58,16,0.25)", fontFamily: "Georgia,serif", fontSize: 13, color: "#5a3010", background: "#fffaf5", outline: "none" }}
          />
          <input
            type="number" min={0} value={stockVal}
            onChange={(e) => {
              if (categoria === "pizzas") {
                setEditStock(prev => ({ ...prev, pizzas: { ...(prev.pizzas || {}), [item.id]: e.target.value } }));
              } else {
                setEditStock(prev => ({ ...prev, [dia]: { ...(prev[dia] || {}), [item.id]: e.target.value } }));
              }
            }}
            style={{ width: 52, padding: "5px 6px", borderRadius: 6, border: "1.5px solid rgba(123,58,16,0.25)", fontFamily: "Georgia,serif", fontSize: 13, textAlign: "center", background: "#fffaf5", outline: "none" }}
            title="Cantidad disponible"
          />
          <button
            onClick={() => toggleOculto(item.id)}
            title={oculto ? "Mostrar en el menú" : "Ocultar del menú"}
            style={{ background: oculto ? "#27ae60" : "#e67e22", color: "#fff", border: "none", borderRadius: 6, padding: "5px 8px", cursor: "pointer", fontSize: 12, flexShrink: 0 }}>
            {oculto ? "👁 Mostrar" : "🙈 Ocultar"}
          </button>
          {isExtra && (
            <button
              onClick={async () => {
                if (categoria === "pizzas") {
                  const updated = extraItems.filter(i => i.id !== item.id);
                  setExtraItems(updated); await saveData("gasty-extra-fijos", updated);
                } else {
                  const updated = { ...extraItemsByDia, [dia]: (extraItemsByDia[dia] || []).filter(i => i.id !== item.id) };
                  setExtraItemsByDia(updated); await saveData("gasty-extra-dias", updated);
                }
                showMsg("🗑️ Eliminado");
              }}
              style={{ background: "#c0392b", color: "#fff", border: "none", borderRadius: 6, padding: "5px 8px", cursor: "pointer", fontSize: 12, flexShrink: 0 }}>
              🗑️
            </button>
          )}
        </div>
        {/* Fila 2: descripción + precio */}
        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
          <input
            value={getVal(item, "descripcion")}
            onChange={e => setField(item.id, "descripcion", e.target.value)}
            placeholder="Descripción..."
            style={{ flex: 1, padding: "4px 8px", borderRadius: 6, border: "1.5px solid rgba(123,58,16,0.2)", fontFamily: "Georgia,serif", fontSize: 12, color: "#888", background: "#fffaf5", outline: "none" }}
          />
          <div style={{ display: "flex", alignItems: "center", gap: 4, flexShrink: 0 }}>
            <span style={{ fontSize: 12, color: "#C8953A", fontWeight: "bold" }}>$</span>
            <input
              type="number" min={0}
              value={getVal(item, "precio")}
              onChange={e => setField(item.id, "precio", e.target.value)}
              style={{ width: 80, padding: "4px 6px", borderRadius: 6, border: "1.5px solid rgba(200,149,58,0.5)", fontFamily: "Georgia,serif", fontSize: 13, color: "#C8953A", fontWeight: "bold", background: "#fffaf5", outline: "none", textAlign: "right" }}
              title="Precio"
            />
          </div>
        </div>
      </div>
    );
  };

  const DIAS_LOCAL = ["Lunes", "Martes", "Miércoles", "Jueves"];

  return (
    <>
      {msg && <div style={{ background: "#27ae60", color: "#fff", borderRadius: 8, padding: "10px 14px", marginBottom: 12, fontSize: 14, textAlign: "center" }}>{msg}</div>}
      <p style={{ fontSize: 12, color: "#aaa", marginBottom: 12 }}>Editá nombre, descripción, precio y stock. Podés ocultar platos del menú sin eliminarlos.</p>

      {/* Pizzas, Pan y Fainá */}
      <div style={{ background: "#fff", borderRadius: 14, padding: 16, marginBottom: 14, boxShadow: "0 2px 10px rgba(123,58,16,0.08)", border: "1px solid rgba(123,58,16,0.1)" }}>
        <div style={{ fontWeight: "bold", color: C.gold, marginBottom: 14, fontSize: 15 }}>🍕 Pizzas, Pan y Fainá</div>
        {[...PIZZAS, ...extraItems].map(item => renderRow(item, "pizzas", null))}
      </div>

      {/* Comidas por día */}
      {DIAS_LOCAL.map(dia => (
        <div key={dia} style={{ background: "#fff", borderRadius: 14, padding: 16, marginBottom: 14, boxShadow: "0 2px 10px rgba(123,58,16,0.08)", border: "1px solid rgba(123,58,16,0.1)" }}>
          <div style={{ fontWeight: "bold", color: C.gold, marginBottom: 14, fontSize: 15 }}>🥘 Comidas Caseras — {dia}</div>
          {[...MENU[dia], ...(extraItemsByDia[dia] || [])].map(item => renderRow(item, "caseras", dia))}
        </div>
      ))}

      <button style={{ ...S.btn(), width: "100%", marginBottom: 10 }} onClick={handleSave}>💾 Guardar todos los cambios</button>
    </>
  );
}

// ── MENU ADMIN COMPONENT ──────────────────────────────────────────────────────
const DIAS_ALL = ["Lunes", "Martes", "Miércoles", "Jueves"];
const EMOJIS = ["🍕","🥧","🥟","🍝","🥩","🥒","🫔","🍞","🫓","🥗","🍲","🫕","🧆","🥘","🍳"];

function FotosAdmin({ fotosCustom, setFotosCustom }) {
  const items = [
    { key: "faina", label: "Fainá Grande" },
    { key: "muzzarella", label: "Pizza Muzzarella" },
    { key: "fugazza", label: "Pizza Fugazza" },
    { key: "jamon_muzz", label: "Pizza Jamón y Muzzarella" },
    { key: "jamon_morrones", label: "Pizza Jamón y Morrones" },
    { key: "calabresa", label: "Pizza Calabresa" },
    { key: "milanesa", label: "Milanesas" },
    { key: "zapallitos", label: "Zapallitos Rellenos" },
    { key: "canelones", label: "Canelones" },
    { key: "pastel", label: "Pastel de Papas/Calabaza" },
    { key: "albondigas", label: "Albóndigas" },
    { key: "empanadas", label: "Empanadas" },
    { key: "pan", label: "Pan Multicereal" },
  ];

  function handleFile(key, e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async (ev) => {
      const updated = { ...fotosCustom, [key]: ev.target.result };
      setFotosCustom(updated);
      await saveData("gasty-fotos", updated);
    };
    reader.readAsDataURL(file);
  }

  const [escalas, setEscalas] = React.useState({});

  const getEscala = (key) => escalas[key] ?? 100;
  const handleEscala = async (key, val) => {
    const updated = { ...escalas, [key]: parseInt(val) };
    setEscalas(updated);
    await saveData("gasty-foto-escalas", updated);
  };

  React.useEffect(() => {
    const db = window._db;
    if (!db) return;
    db.getDoc(db.doc(db.fs, "gasty", "gasty-foto-escalas")).then(snap => {
      if (snap.exists()) setEscalas(snap.data().v || {});
    });
  }, []);

  return (
    <div>
      <p style={{ fontSize: 13, color: "#888", marginBottom: 16 }}>Tocá cada foto para cambiarla. Usá el deslizador para ajustar el tamaño de imagen que ve el cliente.</p>
      {items.map(item => (
        <div key={item.key} style={{ background: "#fff", borderRadius: 10, padding: "12px 14px", marginBottom: 14 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 10 }}>
            <div style={{ width: 70, height: 70, borderRadius: 8, background: "#eee", overflow: "hidden", flexShrink: 0 }}>
              <img
                src={fotosCustom[item.key] || FOTOS[item.key] || ""}
                alt={item.label}
                style={{ width: "100%", height: "100%", objectFit: "contain", transform: `scale(${getEscala(item.key)/100})`, transformOrigin: "center center" }}
              />
            </div>
            <div style={{ flex: 1 }}>
              <div style={{ fontWeight: "bold", fontSize: 14, marginBottom: 6 }}>{item.label}</div>
              <label style={{ background: C.brown, color: "#fff", borderRadius: 6, padding: "4px 12px", fontSize: 12, cursor: "pointer" }}>
                📷 Cambiar foto
                <input type="file" accept="image/*" style={{ display: "none" }} onChange={e => handleFile(item.key, e)} />
              </label>
            </div>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <span style={{ fontSize: 11, color: "#999", whiteSpace: "nowrap" }}>Escala cliente:</span>
            <input type="range" min={50} max={200} value={getEscala(item.key)}
              onChange={e => handleEscala(item.key, e.target.value)}
              style={{ flex: 1, accentColor: C.brown }} />
            <span style={{ fontSize: 12, color: C.brown, minWidth: 38, textAlign: "right" }}>{getEscala(item.key)}%</span>
          </div>
        </div>
      ))}
    </div>
  );
}


function MenuAdmin({ extraItems, setExtraItems, extraItemsByDia, setExtraItemsByDia, stock, setStock }) {
  const [tab, setTab] = useState("fijos"); // fijos | diarios | agregar
  const [form, setForm] = useState({ nombre: "", descripcion: "", precio: "", emoji: "🍕", dia: "Lunes", tipo: "diario", foto: null });
  const [editId, setEditId] = useState(null);
  const [editData, setEditData] = useState({});
  const [msg, setMsg] = useState("");

  const handleFoto = (e, setter) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new window.Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        const side = Math.min(img.width, img.height);
        canvas.width = 400; canvas.height = 400;
        const ctx = canvas.getContext("2d");
        const sx = (img.width - side) / 2;
        const sy = (img.height - side) / 2;
        ctx.drawImage(img, sx, sy, side, side, 0, 0, 400, 400);
        setter(canvas.toDataURL("image/jpeg", 0.65));
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  };

  const showMsg = (m) => { setMsg(m); setTimeout(() => setMsg(""), 2500); };

  const handleAgregar = async () => {
    if (!form.nombre || !form.precio) { showMsg("⚠️ Completá nombre y precio."); return; }
    const newItem = {
      id: `custom-${Date.now()}`,
      nombre: form.nombre,
      descripcion: form.descripcion,
      precio: parseInt(form.precio),
      emoji: form.emoji,
      foto: form.foto || null,
      activo: true,
    };
    if (form.tipo === "fijo") {
      const updated = [...extraItems, newItem];
      setExtraItems(updated);
      await saveData("gasty-extra-fijos", updated);
      const newStock = { ...stock, pizzas: { ...stock.pizzas, [newItem.id]: 10 } };
      setStock(newStock); await saveData("gasty-stock2", newStock);
    } else {
      const updated = { ...extraItemsByDia, [form.dia]: [...(extraItemsByDia[form.dia] || []), newItem] };
      setExtraItemsByDia(updated);
      await saveData("gasty-extra-dias", updated);
      const newStock = { ...stock, [form.dia]: { ...stock[form.dia], [newItem.id]: 10 } };
      setStock(newStock); await saveData("gasty-stock2", newStock);
    }
    setForm({ nombre: "", descripcion: "", precio: "", emoji: "🍕", dia: "Lunes", tipo: "diario", foto: null });
    showMsg("✅ Plato agregado.");
    setTab("fijos");
  };

  const toggleActivo = async (item, tipo, dia) => {
    if (tipo === "fijo") {
      const updated = extraItems.map(i => i.id === item.id ? { ...i, activo: !i.activo } : i);
      setExtraItems(updated); await saveData("gasty-extra-fijos", updated);
    } else {
      const updated = { ...extraItemsByDia, [dia]: (extraItemsByDia[dia] || []).map(i => i.id === item.id ? { ...i, activo: !i.activo } : i) };
      setExtraItemsByDia(updated); await saveData("gasty-extra-dias", updated);
    }
  };

  const handleEdit = async (item, tipo, dia) => {
    if (tipo === "fijo") {
      const updated = extraItems.map(i => i.id === item.id ? { ...i, ...editData, precio: parseInt(editData.precio) || i.precio } : i);
      setExtraItems(updated); await saveData("gasty-extra-fijos", updated);
    } else {
      const updated = { ...extraItemsByDia, [dia]: (extraItemsByDia[dia] || []).map(i => i.id === item.id ? { ...i, ...editData, precio: parseInt(editData.precio) || i.precio } : i) };
      setExtraItemsByDia(updated); await saveData("gasty-extra-dias", updated);
    }
    setEditId(null); setEditData({}); showMsg("✅ Guardado.");
  };

  const handleDelete = async (item, tipo, dia) => {
    // Sin confirm para evitar problemas en algunos browsers
    if (tipo === "fijo") {
      const updated = extraItems.filter(i => i.id !== item.id);
      setExtraItems(updated); await saveData("gasty-extra-fijos", updated);
    } else {
      const updated = { ...extraItemsByDia, [dia]: (extraItemsByDia[dia] || []).filter(i => i.id !== item.id) };
      setExtraItemsByDia(updated); await saveData("gasty-extra-dias", updated);
    }
    showMsg("🗑️ Eliminado.");
  };

  const renderItem = (item, tipo, dia) => (
    <div key={item.id} style={{ ...{ background: "#fff", borderRadius: 12, padding: 14, marginBottom: 10, boxShadow: "0 2px 8px rgba(123,58,16,0.08)", border: "1px solid rgba(123,58,16,0.1)" }, opacity: item.activo === false ? 0.5 : 1 }}>
      {editId === item.id ? (
        <>
          <input style={{ width: "100%", padding: "8px 10px", borderRadius: 8, border: "1.5px solid rgba(123,58,16,0.3)", fontFamily: "Georgia,serif", fontSize: 14, color: "#7B3A10", background: "#fff", boxSizing: "border-box", marginBottom: 8, outline: "none" }}
            value={editData.nombre ?? item.nombre} onChange={e => setEditData(p => ({ ...p, nombre: e.target.value }))} placeholder="Nombre" />
          <input style={{ width: "100%", padding: "8px 10px", borderRadius: 8, border: "1.5px solid rgba(123,58,16,0.3)", fontFamily: "Georgia,serif", fontSize: 13, color: "#7B3A10", background: "#fff", boxSizing: "border-box", marginBottom: 8, outline: "none" }}
            value={editData.descripcion ?? item.descripcion} onChange={e => setEditData(p => ({ ...p, descripcion: e.target.value }))} placeholder="Descripción" />
          <input style={{ width: "100%", padding: "8px 10px", borderRadius: 8, border: "1.5px solid rgba(123,58,16,0.3)", fontFamily: "Georgia,serif", fontSize: 14, color: "#7B3A10", background: "#fff", boxSizing: "border-box", marginBottom: 8, outline: "none" }}
            type="number" value={editData.precio ?? item.precio} onChange={e => setEditData(p => ({ ...p, precio: e.target.value }))} placeholder="Precio" />
          <div style={{ display: "flex", gap: 8 }}>
            <button onClick={() => handleEdit(item, tipo, dia)} style={{ background: "#7B3A10", color: "#F5F0E8", border: "none", borderRadius: 8, padding: "8px 16px", fontFamily: "Georgia,serif", cursor: "pointer", fontSize: 13, fontWeight: "bold" }}>Guardar</button>
            <button onClick={() => { setEditId(null); setEditData({}); }} style={{ background: "transparent", border: "1.5px solid #7B3A10", color: "#7B3A10", borderRadius: 8, padding: "8px 14px", fontFamily: "Georgia,serif", cursor: "pointer", fontSize: 13 }}>Cancelar</button>
          </div>
        </>
      ) : (
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          {item.foto && <img src={item.foto} alt="" style={{ width: 48, height: 48, borderRadius: 8, objectFit: "cover" }} />}
          <div style={{ flex: 1 }}>
            <div style={{ fontWeight: "bold", fontSize: 14 }}>{item.emoji} {item.nombre}</div>
            <div style={{ fontSize: 12, color: "#888" }}>{item.descripcion}</div>
            <div style={{ fontSize: 13, color: "#C8953A", fontWeight: "bold" }}>${item.precio?.toLocaleString("es-AR")}</div>
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 6, alignItems: "flex-end" }}>
            <button onClick={() => { setEditId(item.id); setEditData({}); }} style={{ background: "#C8953A", color: "#fff", border: "none", borderRadius: 6, padding: "5px 10px", fontSize: 11, cursor: "pointer", fontFamily: "Georgia,serif" }}>✏️ Editar</button>
            <button onClick={() => toggleActivo(item, tipo, dia)} style={{ background: item.activo === false ? "#27ae60" : "#888", color: "#fff", border: "none", borderRadius: 6, padding: "5px 10px", fontSize: 11, cursor: "pointer", fontFamily: "Georgia,serif" }}>
              {item.activo === false ? "✅ Activar" : "⏸ Pausar"}
            </button>
            <button onClick={() => handleDelete(item, tipo, dia)} style={{ background: "#c0392b", color: "#fff", border: "none", borderRadius: 6, padding: "5px 10px", fontSize: 11, cursor: "pointer", fontFamily: "Georgia,serif" }} title="Eliminar plato">🗑️ Eliminar</button>
          </div>
        </div>
      )}
    </div>
  );

  return (
    <div>
      {msg && <div style={{ background: "#7B3A10", color: "#fff", borderRadius: 8, padding: "10px 14px", marginBottom: 12, fontSize: 14, textAlign: "center" }}>{msg}</div>}

      <div style={{ display: "flex", gap: 6, marginBottom: 16 }}>
        {["fijos","agregar"].map(t => (
          <button key={t} style={{ flex: 1, padding: "8px 0", background: tab === t ? "#7B3A10" : "transparent", color: tab === t ? "#F5F0E8" : "#7B3A10", border: "none", fontFamily: "Georgia,serif", fontSize: 12, cursor: "pointer", fontWeight: tab === t ? "bold" : "normal", borderRadius: 8 }}
            onClick={() => setTab(t)}>
            {t === "fijos" ? "Ver platos" : "Agregar"}
          </button>
        ))}
      </div>

      {/* VER PLATOS */}
      {tab === "fijos" && (
        <>
          <p style={{ fontSize: 12, color: "#aaa", marginBottom: 12 }}>Platos del menú (pizzas/fainá y extras).</p>
          {extraItems.length === 0 && DIAS_ALL.every(d => !(extraItemsByDia[d] || []).length) && <p style={{ color: "#ccc", fontSize: 13 }}>No hay platos extra todavía.</p>}
          {extraItems.length > 0 && (
            <>
              <div style={{ fontWeight: "bold", color: "#C8953A", marginBottom: 8 }}>🍕 Pizzas / Fainá / Pan</div>
              {extraItems.map(item => renderItem(item, "fijo", null))}
            </>
          )}
          {DIAS_ALL.map(dia => (
            <div key={dia}>
              {(extraItemsByDia[dia] || []).length > 0 && (
                <>
                  <div style={{ fontWeight: "bold", color: "#C8953A", marginBottom: 8, marginTop: 12 }}>🥘 Comidas Caseras</div>
                  {(extraItemsByDia[dia] || []).map(item => renderItem(item, "diario", dia))}
                </>
              )}
            </div>
          ))}
        </>
      )}

      {/* AGREGAR */}
      {tab === "agregar" && (
        <div style={{ background: "#fff", borderRadius: 12, padding: 16, boxShadow: "0 2px 8px rgba(123,58,16,0.08)", border: "1px solid rgba(123,58,16,0.1)" }}>
          <h3 style={{ margin: "0 0 14px", color: "#7B3A10" }}>Agregar nuevo plato</h3>

          <label style={{ fontSize: 12, color: "#7B3A10", fontWeight: "bold", display: "block", marginBottom: 4 }}>Categoría</label>
          <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
            <button onClick={() => setForm(p => ({ ...p, tipo: "fijo" }))} style={{ flex: 1, padding: "8px", background: form.tipo === "fijo" ? "#7B3A10" : "transparent", color: form.tipo === "fijo" ? "#F5F0E8" : "#7B3A10", border: "1.5px solid #7B3A10", borderRadius: 8, fontFamily: "Georgia,serif", fontSize: 13, cursor: "pointer" }}>🍕 Pizzas / Fainá / Pan</button>
            <button onClick={() => setForm(p => ({ ...p, tipo: "diario" }))} style={{ flex: 1, padding: "8px", background: form.tipo === "diario" ? "#7B3A10" : "transparent", color: form.tipo === "diario" ? "#F5F0E8" : "#7B3A10", border: "1.5px solid #7B3A10", borderRadius: 8, fontFamily: "Georgia,serif", fontSize: 13, cursor: "pointer" }}>🥘 Comidas Caseras</button>
          </div>

          <label style={{ fontSize: 12, color: "#7B3A10", fontWeight: "bold", display: "block", marginBottom: 4 }}>Emoji</label>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 12 }}>
            {EMOJIS.map(e => (
              <button key={e} onClick={() => setForm(p => ({ ...p, emoji: e }))}
                style={{ width: 36, height: 36, borderRadius: 8, border: form.emoji === e ? "2px solid #7B3A10" : "1px solid #ddd", background: form.emoji === e ? "#f5f0e8" : "#fff", fontSize: 18, cursor: "pointer" }}>{e}</button>
            ))}
          </div>

          <label style={{ fontSize: 12, color: "#7B3A10", fontWeight: "bold", display: "block", marginBottom: 4 }}>Nombre</label>
          <input style={{ width: "100%", padding: "11px 13px", borderRadius: 8, border: "1.5px solid rgba(123,58,16,0.3)", fontFamily: "Georgia,serif", fontSize: 14, color: "#7B3A10", background: "#fff", boxSizing: "border-box", marginBottom: 10, outline: "none" }}
            value={form.nombre} onChange={e => setForm(p => ({ ...p, nombre: e.target.value }))} placeholder="Ej: Canelones de verdura" />

          <label style={{ fontSize: 12, color: "#7B3A10", fontWeight: "bold", display: "block", marginBottom: 4 }}>Descripción</label>
          <input style={{ width: "100%", padding: "11px 13px", borderRadius: 8, border: "1.5px solid rgba(123,58,16,0.3)", fontFamily: "Georgia,serif", fontSize: 14, color: "#7B3A10", background: "#fff", boxSizing: "border-box", marginBottom: 10, outline: "none" }}
            value={form.descripcion} onChange={e => setForm(p => ({ ...p, descripcion: e.target.value }))} placeholder="Ingredientes, gramaje, etc." />

          <label style={{ fontSize: 12, color: "#7B3A10", fontWeight: "bold", display: "block", marginBottom: 4 }}>Precio ($)</label>
          <input style={{ width: "100%", padding: "11px 13px", borderRadius: 8, border: "1.5px solid rgba(123,58,16,0.3)", fontFamily: "Georgia,serif", fontSize: 14, color: "#7B3A10", background: "#fff", boxSizing: "border-box", marginBottom: 10, outline: "none" }}
            type="number" value={form.precio} onChange={e => setForm(p => ({ ...p, precio: e.target.value }))} placeholder="Ej: 9500" />

          <label style={{ fontSize: 12, color: "#7B3A10", fontWeight: "bold", display: "block", marginBottom: 4 }}>Foto (opcional)</label>
          <input type="file" accept="image/*" onChange={e => handleFoto(e, foto => setForm(p => ({ ...p, foto })))}
            style={{ marginBottom: 12, fontSize: 13, color: "#7B3A10" }} />
          {form.foto && <img src={form.foto} alt="preview" style={{ width: 80, height: 80, borderRadius: 8, objectFit: "cover", marginBottom: 12 }} />}

          <button style={{ background: "#7B3A10", color: "#F5F0E8", border: "none", borderRadius: 8, padding: "12px 20px", fontSize: 14, fontFamily: "Georgia,serif", cursor: "pointer", fontWeight: "bold", width: "100%" }}
            onClick={handleAgregar}>Agregar plato</button>
        </div>
      )}
    </div>
  );
}
const domNode = document.getElementById('root');
const root = ReactDOM.createRoot(domNode);
root.render(React.createElement(App));
</script>
</body>
</html>
